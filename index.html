<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Ruska — Apprendre le russe, de zéro à bilingue</title>
  <meta name="description" content="Ruska : application hors ligne pour apprendre le russe. Alphabet, prononciation, cours de grammaire, vocabulaire, flashcards intelligentes, traductions expliquées et audio.">
  <meta name="theme-color" content="#0b0d18">
  <meta name="color-scheme" content="dark">

  <!-- iOS : installation sur l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruska">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="app">
    <main id="view" tabindex="-1"></main>

    <nav id="tabbar" aria-label="Navigation principale">
      <a href="#/" data-tab="home" id="tab-home">
        <svg viewBox="0 0 24 24"><path d="M9 20H5a1 1 0 0 1-1-1v-8.5a1 1 0 0 1 .4-.8l7-5.25a1 1 0 0 1 1.2 0l7 5.25a1 1 0 0 1 .4.8V19a1 1 0 0 1-1 1h-4v-6h-6z"/></svg>
        <span>Parcours</span>
      </a>
      <a href="#/review" data-tab="review" id="tab-review">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10.5A2.5 2.5 0 0 1 21 5.5V17"/></svg>
        <span>Réviser</span>
        <b class="badge" id="due-badge" hidden></b>
      </a>
      <a href="#/practice" data-tab="practice" id="tab-practice">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
        <span>Pratique</span>
      </a>
      <a href="#/lexicon" data-tab="lexicon" id="tab-lexicon">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>
        <span>Lexique</span>
      </a>
      <a href="#/profile" data-tab="profile" id="tab-profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Profil</span>
      </a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>Ruska a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW enregistré:', reg.scope))
          .catch(err => console.error('Erreur SW:', err));
      });
    }
  </script>
</body>
</html>
